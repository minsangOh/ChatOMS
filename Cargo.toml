[workspace]
members = [
    "crates/chatoms-domain",
    "crates/chatoms-ports",
    "crates/chatoms-application",
    "crates/chatoms-infrastructure",
    "crates/chatoms-platform",
    "src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
chatoms-domain = { path = "crates/chatoms-domain", version = "=0.1.0" }
chatoms-ports = { path = "crates/chatoms-ports", version = "=0.1.0" }
chatoms-application = { path = "crates/chatoms-application", version = "=0.1.0" }
chatoms-infrastructure = { path = "crates/chatoms-infrastructure", version = "=0.1.0" }
chatoms-platform = { path = "crates/chatoms-platform", version = "=0.1.0" }
tauri = "=2.11.5"
tauri-build = "=2.6.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["serde", "v7"] }
sha2 = "=0.11.0"
regex = "=1.13.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
tracing-appender = "=0.2.5"
windows-sys = "=0.61.2"
tempfile = "=3.27.0"
